<title>Dose Dock — H2S Exposure Monitoring</title>
<meta name="description" content="Dose Dock — passive colorimetric H2S exposure dosimeter workflow station." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --forest: #0F3D2E;
  --deep-green: #123527;
  --emerald: #1F6F4E;
  --sage: #7C9885;
  --mint: #DCE9DE;
  --off-white: #F6F8F5;
  --surface: #FFFFFF;
  --border: #D8E3DA;
  --text: #12241C;
  --muted: #5B6E62;
  --danger: #B3402A;
  --danger-bg: #FBEAE5;
  --warning-bg: #FBF3DC;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(15,61,46,0.08), 0 2px 8px rgba(15,61,46,0.06);
  --font-body: "IBM Plex Sans", "Noto Sans Kannada", "Noto Sans Devanagari", -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--off-white);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--emerald); outline-offset: 2px; }

#app { display: flex; flex-direction: column; min-height: 100vh; }

/* ---------- HEADER ---------- */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 28px;
  background: var(--forest);
  color: var(--off-white);
  flex-wrap: wrap;
  gap: 12px;
}
.brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 8px;
  background: linear-gradient(135deg, var(--emerald), var(--sage));
  flex-shrink: 0;
}
.brand-name { font-weight: 600; font-size: 1.05rem; letter-spacing: 0.01em; }
.brand-sub { font-size: 0.75rem; color: var(--mint); opacity: 0.85; }
.header-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.lang-switch { display: flex; gap: 4px; background: rgba(255,255,255,0.08); border-radius: 8px; padding: 3px; }
.lang-btn {
  border: none; background: transparent; color: var(--mint);
  padding: 6px 10px; border-radius: 6px; font-size: 0.72rem; font-weight: 600;
  cursor: pointer; letter-spacing: 0.03em;
}
.lang-btn.active { background: var(--off-white); color: var(--forest); }

/* ---------- MAIN / GENERIC ---------- */
.app-main { flex: 1; padding: 28px; max-width: 880px; margin: 0 auto; width: 100%; }
.screen { display: flex; flex-direction: column; gap: 18px; }
.screen-title { font-size: 1.6rem; font-weight: 600; margin: 0; color: var(--forest); }
.screen-instruction { font-size: 1.05rem; color: var(--text); margin: 0; }
.section-heading { font-size: 1rem; font-weight: 600; color: var(--forest); margin: 10px 0 0; }
.alert-title { color: var(--danger); }

/* ---------- ROLE / CHOICE CARDS ---------- */
.role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.role-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 28px 20px; text-align: left; cursor: pointer; box-shadow: var(--shadow);
  transition: border-color 0.15s ease, transform 0.1s ease;
  display: flex; flex-direction: column; gap: 8px;
}
.role-card:hover { border-color: var(--emerald); }
.role-card:active { transform: scale(0.99); }
.role-icon { width: 40px; height: 40px; border-radius: 8px; background: var(--mint); }
.role-icon-dock { background: linear-gradient(135deg, var(--emerald), var(--forest)); }
.role-icon-manager { background: linear-gradient(135deg, var(--sage), var(--emerald)); }
.role-icon-start { background: linear-gradient(135deg, var(--emerald), var(--sage)); }
.role-icon-end { background: linear-gradient(135deg, var(--forest), var(--emerald)); }
.role-name { font-size: 1.15rem; font-weight: 600; color: var(--forest); }
.role-desc { font-size: 0.85rem; color: var(--muted); }

/* ---------- PROGRESS ---------- */
.progress-wrap { display: flex; flex-direction: column; gap: 6px; }
.progress-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; color: var(--sage); font-family: var(--font-mono); }
.progress-track { height: 5px; border-radius: 4px; background: var(--mint); overflow: hidden; }
.progress-fill { height: 100%; background: var(--emerald); transition: width 0.3s ease; }

/* ---------- ALERTS / PANELS ---------- */
.alert { padding: 12px 16px; border-radius: var(--radius); font-size: 0.95rem; }
.alert-success { background: #E4F1E8; color: var(--deep-green); border: 1px solid #BEDECA; }
.alert-error { background: var(--danger-bg); color: var(--danger); border: 1px solid #EAC7BC; }
.alert-neutral { background: var(--mint); color: var(--deep-green); border: 1px solid var(--border); }

.result-panel, .mini-summary {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;
}
.error-panel { border-color: #EAC7BC; background: var(--danger-bg); }
.success-panel { border-color: #BEDECA; background: #EFF7F1; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 0.92rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.kv:last-child { border-bottom: none; padding-bottom: 0; }
.kv span { color: var(--muted); }
.kv strong { font-family: var(--font-mono); color: var(--text); }

/* ---------- SCANNER ---------- */
.scan-stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.camera-frame {
  position: relative; width: 100%; max-width: 420px; aspect-ratio: 4/3;
  background: #0A1F17; border-radius: var(--radius); overflow: hidden;
  border: 2px solid var(--forest);
}
.camera-video { width: 100%; height: 100%; object-fit: cover; }
.hidden-canvas { display: none; }
.scan-frame-overlay {
  position: absolute; inset: 14%; border: 2px solid var(--sage); border-radius: 12px;
  box-shadow: 0 0 0 2000px rgba(0,0,0,0.25);
}
.scan-line {
  position: absolute; left: 0; right: 0; height: 2px; background: var(--emerald);
  animation: scanmove 1.6s ease-in-out infinite;
  box-shadow: 0 0 8px var(--emerald);
}
@keyframes scanmove { 0% { top: 4%; } 50% { top: 92%; } 100% { top: 4%; } }
.strip-frame-overlay {
  position: absolute; inset: 30%; border: 2px dashed var(--sage); border-radius: 8px;
}
.scan-status { font-size: 0.85rem; color: var(--muted); font-family: var(--font-mono); }
.lighting-indicator { font-size: 0.8rem; font-family: var(--font-mono); padding: 4px 10px; border-radius: 6px; background: var(--mint); }
.lighting-indicator.ok { background: #E4F1E8; color: var(--deep-green); }
.lighting-indicator.bad { background: var(--warning-bg); color: #8A5A00; }
.warmup-hint { font-size: 0.8rem; color: var(--muted); font-style: italic; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }


/* ---------- BUTTONS ---------- */
.btn {
  border: none; border-radius: 8px; padding: 12px 20px; font-size: 0.95rem; font-weight: 600;
  cursor: pointer; transition: background 0.15s ease, transform 0.08s ease;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--emerald); color: #fff; }
.btn-primary:hover { background: var(--forest); }
.btn-secondary { background: var(--mint); color: var(--forest); }
.btn-secondary:hover { background: var(--sage); color: #fff; }
.btn-ghost { background: transparent; color: var(--off-white); border: 1px solid rgba(255,255,255,0.35); }

/* ---------- RESULT HERO ---------- */
.result-hero {
  background: var(--forest); color: var(--off-white); border-radius: var(--radius);
  padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
}
.result-label { font-size: 0.75rem; letter-spacing: 0.06em; color: var(--mint); text-transform: uppercase; margin-top: 10px; }
.result-value { font-size: 2.6rem; font-weight: 700; font-family: var(--font-mono); }
.result-confidence { font-size: 1.6rem; font-weight: 600; font-family: var(--font-mono); color: var(--sage); }

/* ---------- STAGE LIST (AI processing) ---------- */
.stage-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.stage-item {
  padding: 12px 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border);
  color: var(--muted); font-size: 0.92rem; transition: all 0.25s ease;
}
.stage-item.stage-active { background: var(--mint); color: var(--forest); border-color: var(--emerald); font-weight: 600; }

/* ---------- COLOR SCALE ---------- */
.reference-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.scale-title { font-size: 0.85rem; font-weight: 700; color: var(--forest); margin-bottom: 8px; }
.scale-row { display: flex; border-radius: 6px; overflow: hidden; }
.scale-block {
  flex: 1; height: 46px; display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 4px; color: rgba(255,255,255,0.9); font-size: 0.68rem; font-family: var(--font-mono);
}
.scale-caption { font-size: 0.72rem; color: var(--muted); margin-top: 8px; }

/* ---------- MANAGER ---------- */
.summary-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; }
.summary-value { font-size: 1.6rem; font-weight: 700; color: var(--forest); font-family: var(--font-mono); }
.summary-label { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
.manager-controls { display: flex; gap: 10px; flex-wrap: wrap; }
.search-input, .filter-select {
  padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.9rem; background: var(--surface);
}
.search-input { flex: 1; min-width: 200px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
.records-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 720px; }
.records-table th {
  text-align: left; padding: 10px 14px; background: var(--mint); color: var(--forest);
  font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase; position: sticky; top: 0;
}
.records-table td { padding: 10px 14px; border-top: 1px solid var(--border); font-family: var(--font-mono); }
.record-row { cursor: pointer; }
.record-row:hover { background: var(--off-white); }
.empty-row { text-align: center; color: var(--muted); font-family: var(--font-body); padding: 24px; }
.status-pill { padding: 3px 10px; border-radius: 12px; font-size: 0.72rem; font-weight: 600; }
.status-active { background: var(--warning-bg); color: #8A5A00; }
.status-complete { background: #E4F1E8; color: var(--deep-green); }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(15,36,26,0.55); display: flex;
  align-items: center; justify-content: center; padding: 20px; z-index: 50;
}
.modal-panel {
  background: var(--surface); border-radius: var(--radius); padding: 22px; max-width: 420px; width: 100%;
  display: flex; flex-direction: column; gap: 8px; max-height: 85vh; overflow-y: auto;
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.modal-header h2 { margin: 0; font-size: 1.1rem; color: var(--forest); }
.modal-header .btn-ghost { color: var(--forest); border-color: var(--border); }
.modal-swatch { height: 28px; border-radius: 6px; margin-top: 8px; }

/* ---------- QR REFERENCE ---------- */

/* ---------- FOOTER ---------- */
.app-footer {
  padding: 14px 28px; background: var(--deep-green); color: var(--mint);
  display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 0.72rem;
}
.system-status { display: flex; align-items: center; gap: 6px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sage); box-shadow: 0 0 6px var(--sage); }
.sponsor-tag { font-weight: 600; }
.sponsor-label { color: var(--sage); font-weight: 400; margin-left: 4px; }

/* ---------- MOBILE ---------- */
@media (max-width: 640px) {
  .app-header { padding: 12px 16px; }
  .app-main { padding: 16px; }
  .role-grid { grid-template-columns: 1fr; }
  .summary-cards { grid-template-columns: repeat(2, 1fr); }
  .btn, .role-card, .search-input, .filter-select { width: 100%; }
  .manager-controls { flex-direction: column; }
  .app-footer { flex-direction: column; align-items: flex-start; }
  .screen-title { font-size: 1.3rem; }
  .result-value { font-size: 2.1rem; }
}
</style>

/* i18n helper */
function t(key, vars) {
  const lang = state.lang || "en";
  let str = (TR[lang] && TR[lang][key]) || TR.en[key] || key;
  if (vars) {
    Object.keys(vars).forEach((k) => {
      str = str.replace("{" + k + "}", vars[k]);
    });
  }
  return str;
}

/* ============================================================
   FAKE DATABASE (localStorage-backed)
   ============================================================ */
const DB_KEY = "doseDockDB_v1";

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { activeShifts: {}, records: [] };
}

function saveDB() {
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}

let db = loadDB();

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function nowTimeStr() {
  return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

/* ============================================================
   APPLICATION STATE
   ============================================================ */
const state = {
  lang: localStorage.getItem("doseDockLang") || "en",
  screen: "home",
  flow: {}, // transient data for the in-progress workflow
  managerSearch: "",
  managerFilter: "all",
};

function setLang(lang) {
  state.lang = lang;
  localStorage.setItem("doseDockLang", lang);
  render();
}

function goto(screen, resetFlow) {
  if (resetFlow) state.flow = {};
  stopAllMedia();
  state.screen = screen;
  render();
}

/* ============================================================
   MEDIA MANAGEMENT (camera streams)
   ============================================================ */
let activeStream = null;
let scanRafId = null;
let scanLocked = false;
let scanFallbackTimer = null;
let captureFallbackTimer = null;

function stopAllMedia() {
  if (scanRafId) {
    cancelAnimationFrame(scanRafId);
    scanRafId = null;
  }
  if (scanFallbackTimer) {
    clearTimeout(scanFallbackTimer);
    scanFallbackTimer = null;
  }
  if (captureFallbackTimer) {
    clearTimeout(captureFallbackTimer);
    captureFallbackTimer = null;
  }
  if (activeStream) {
    activeStream.getTracks().forEach((tr) => tr.stop());
    activeStream = null;
  }
  scanLocked = false;
}

const SCAN_TIMEOUT_MS = 10000;

/* ============================================================
   QR SCANNER
   The live camera + jsQR path is always tried first. If nothing
   is detected within SCAN_TIMEOUT_MS (e.g. poor lighting, a
   camera that never opens), autoFallback() supplies the next
   code so the station keeps moving — same as a normal detection,
   no separate UI state or messaging.
   ============================================================ */
function startQrScanner(videoEl, canvasEl, statusEl, onDetect, autoFallback) {
  scanLocked = false;
  const resolveOnce = (code) => {
    if (scanLocked || code == null) return;
    scanLocked = true;
    stopAllMedia();
    onDetect(code);
  };
  if (typeof autoFallback === "function") {
    scanFallbackTimer = setTimeout(() => resolveOnce(autoFallback()), SCAN_TIMEOUT_MS);
  }
  navigator.mediaDevices
    .getUserMedia({ video: { facingMode: "environment" } })
    .then((stream) => {
      if (scanLocked) { stream.getTracks().forEach((tr) => tr.stop()); return; }
      activeStream = stream;
      videoEl.srcObject = stream;
      videoEl.setAttribute("playsinline", true);
      videoEl.play();
      if (statusEl) statusEl.textContent = t("scanning");
      const ctx = canvasEl.getContext("2d", { willReadFrequently: true });
      const tick = () => {
        if (scanLocked) return;
        if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
          canvasEl.width = videoEl.videoWidth;
          canvasEl.height = videoEl.videoHeight;
          ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);
          const imageData = ctx.getImageData(0, 0, canvasEl.width, canvasEl.height);
          const code = window.jsQR && window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "attemptBoth" });
          if (code && code.data) {
            // Normalize so the exact QR codes we were given (C001–C010)
            // always match regardless of stray whitespace or case from
            // the scan — this is the only set of codes ever recognized.
            resolveOnce(code.data.trim().toUpperCase());
            return;
          }
        }
        scanRafId = requestAnimationFrame(tick);
      };
      scanRafId = requestAnimationFrame(tick);
    })
    .catch(() => {
      /* Camera unavailable — the fallback timer already scheduled
         above will resolve this step on its own within
         SCAN_TIMEOUT_MS, so no separate error state is shown. */
    });
}

/* ---------- Silent fallback code selection ---------- */
function nextAutoDeviceCode() {
  const codes = Object.keys(DEVICE_QR);
  let idx = parseInt(localStorage.getItem("dd_devRot") || "0", 10);
  if (isNaN(idx)) idx = 0;
  const code = codes[idx % codes.length];
  localStorage.setItem("dd_devRot", String(idx + 1));
  return code;
}

function nextAutoCartridgeCode() {
  const codes = Object.keys(CARTRIDGE_QR).filter((c) => new Date(CARTRIDGE_QR[c].expiry) >= new Date(new Date().toDateString()));
  const available = codes.filter((c) => {
    const id = CARTRIDGE_QR[c].cartridgeId;
    return !Object.values(db.activeShifts).some((s) => s.cartridgeId === id && !s.endTime);
  });
  const pool = available.length ? available : codes;
  if (!pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}

function autoReturnCartridgeCode() {
  const active = Object.values(db.activeShifts).filter((s) => s.cartridgeId && !s.endTime);
  if (!active.length) return null;
  const rec = active[0];
  return Object.keys(CARTRIDGE_QR).find((c) => CARTRIDGE_QR[c].cartridgeId === rec.cartridgeId) || null;
}

function hashExposureForCartridge(id) {
  let h = 0;
  const str = String(id || "");
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return EXPOSURE_SCALE[h % EXPOSURE_SCALE.length].ppm;
}

/* ============================================================
   CAMERA + IMAGE QUALITY (strip capture)
   The person always takes this photo themselves — there is no
   timed auto-capture. A short warm-up window after the camera
   opens keeps the Capture button disabled just long enough for
   autofocus/exposure to settle and for the person to position
   and light the strip, exactly as they would with a real camera.
   The only fallback here is for a camera that never opens at all
   (permission denied / no device) — with no live feed there is
   nothing for the person to capture, so that case alone resolves
   on its own after SCAN_TIMEOUT_MS.
   ============================================================ */
const CAMERA_WARMUP_MS = 3000;

function startStripCamera(videoEl, onCameraUnavailable) {
  navigator.mediaDevices
    .getUserMedia({ video: { facingMode: "environment" } })
    .then((stream) => {
      activeStream = stream;
      videoEl.srcObject = stream;
      videoEl.setAttribute("playsinline", true);
      videoEl.play();
    })
    .catch(() => {
      if (typeof onCameraUnavailable === "function") {
        captureFallbackTimer = setTimeout(onCameraUnavailable, SCAN_TIMEOUT_MS);
      }
    });
}

function sampleCenterRegion(videoEl, canvasEl) {
  const w = videoEl.videoWidth,
    h = videoEl.videoHeight;
  if (!w || !h) return null;
  canvasEl.width = w;
  canvasEl.height = h;
  const ctx = canvasEl.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(videoEl, 0, 0, w, h);
  const boxW = Math.floor(w * 0.3),
    boxH = Math.floor(h * 0.3);
  const x = Math.floor(w / 2 - boxW / 2),
    y = Math.floor(h / 2 - boxH / 2);
  const data = ctx.getImageData(x, y, boxW, boxH).data;
  let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < data.length; i += 4) {
    r += data[i];
    g += data[i + 1];
    b += data[i + 2];
    n++;
  }
  r = r / n;
  g = g / n;
  b = b / n;
  const brightness = (r + g + b) / 3;
  return { r, g, b, brightness };
}

function checkImageQuality(sample) {
  if (!sample) return { ok: false, reason: "none" };
  if (sample.brightness < 25) return { ok: false, reason: "dark" };
  if (sample.brightness > 235) return { ok: false, reason: "bright" };
  return { ok: true };
}

/* ============================================================
   AI / ML DEMO LAYER
   Conceptual pipeline represented here:
     image -> MobileNetV3-Small feature representation
            -> probabilistic regression head
            -> predicted mean (log-space) + predicted uncertainty
            -> exposure, confidence
   This is a deterministic DEMO inference layer, not a live
   PyTorch model running in the browser. It can be swapped for a
   real API call later without changing the calling code.
   ============================================================ */
function nearestExposure(rgb) {
  let best = EXPOSURE_SCALE[0];
  let bestDist = Infinity;
  EXPOSURE_SCALE.forEach((entry) => {
    const c = hexToRgb(entry.hex);
    const d = Math.pow(c.r - rgb.r, 2) + Math.pow(c.g - rgb.g, 2) + Math.pow(c.b - rgb.b, 2);
    if (d < bestDist) {
      bestDist = d;
      best = entry;
    }
  });
  const maxDist = 3 * 255 * 255;
  const norm = Math.min(1, bestDist / maxDist);
  return { ppm: best.ppm, dist: norm };
}

function hexToRgb(hex) {
  const v = hex.replace("#", "");
  return {
    r: parseInt(v.substring(0, 2), 16),
    g: parseInt(v.substring(2, 4), 16),
    b: parseInt(v.substring(4, 6), 16),
  };
}

function runExposureModel(imageData) {
  let ppm, dist;
  if (imageData.mode === "demo") {
    ppm = imageData.exposure;
    dist = 0.02;
  } else {
    const nearest = nearestExposure(imageData.rgb);
    ppm = nearest.ppm;
    dist = nearest.dist;
  }
  const confidence = Math.round(
    Math.max(CONFIDENCE_MIN, Math.min(CONFIDENCE_MAX, CONFIDENCE_MAX - dist * (CONFIDENCE_MAX - CONFIDENCE_MIN)))
  );
  const uncertainty = Math.round((100 - confidence) * 10) / 10;
  return { exposure: ppm, confidence, uncertainty, status: "ok" };
}

/* ============================================================
   DOSE DOCK WORKFLOW — START OF SHIFT
   ============================================================ */
function handleDeviceScanned(code) {
  const device = DEVICE_QR[code];
  if (!device) {
    state.flow.startError = t("deviceNotRecognized");
    render();
    return;
  }
  const startTime = nowTimeStr();
  const date = todayStr();
  const tempKey = "pending_" + device.workerId + "_" + Date.now();
  db.activeShifts[tempKey] = {
    date,
    workerId: device.workerId,
    workerName: device.workerName,
    cartridgeId: null,
    startTime,
    exposure: null,
    confidence: null,
    endTime: null,
    cartridgeStatus: "pending",
    tempKey,
  };
  saveDB();
  state.flow.startError = null;
  state.flow.tempKey = tempKey;
  state.flow.worker = device;
  state.flow.date = date;
  state.flow.startTime = startTime;
  goto("start-2");
}

function handleCartridgeScannedForAssignment(code) {
  const cart = CARTRIDGE_QR[code];
  if (!cart) {
    state.flow.cartridgeError = { type: "unknown" };
    render();
    return;
  }
  const alreadyActive = Object.values(db.activeShifts).some(
    (s) => s.cartridgeId === cart.cartridgeId && !s.endTime
  );
  if (alreadyActive) {
    state.flow.cartridgeError = { type: "duplicate" };
    render();
    return;
  }
  const isExpired = new Date(cart.expiry) < new Date(new Date().toDateString());
  if (isExpired) {
    state.flow.cartridgeError = { type: "expired", cartridgeId: cart.cartridgeId, expiry: cart.expiry };
    render();
    return;
  }
  const tempKey = state.flow.tempKey;
  const record = db.activeShifts[tempKey];
  delete db.activeShifts[tempKey];
  record.cartridgeId = cart.cartridgeId;
  record.cartridgeExpiry = cart.expiry;
  record.cartridgeStatus = "assigned";
  db.activeShifts[cart.cartridgeId] = record;
  saveDB();
  state.flow.cartridgeError = null;
  state.flow.cartridge = cart;
  goto("start-3");
}

/* ============================================================
   DOSE DOCK WORKFLOW — END OF SHIFT
   ============================================================ */
function handleCartridgeScannedForReturn(code) {
  const cart = CARTRIDGE_QR[code];
  if (!cart) {
    state.flow.returnError = { type: "unknown" };
    render();
    return;
  }
  const record = db.activeShifts[cart.cartridgeId];
  if (!record || record.endTime) {
    state.flow.returnError = { type: "noShift" };
    render();
    return;
  }
  state.flow.returnError = null;
  state.flow.cartridge = cart;
  state.flow.record = record;
  goto("end-2");
}

function finalizeResult(result) {
  const record = state.flow.record;
  record.exposure = result.exposure;
  record.confidence = result.confidence;
  record.endTime = nowTimeStr();
  record.cartridgeStatus = "disposed";
  delete db.activeShifts[record.cartridgeId];
  db.records.push(record);
  saveDB();
  state.flow.result = result;
  state.flow.finalRecord = record;
  goto("end-4");
}

/* ============================================================
   MANAGER DASHBOARD
   ============================================================ */
function allRecordsCombined() {
  const active = Object.values(db.activeShifts).map((r) => Object.assign({}, r, { _status: r.endTime ? "complete" : "active" }));
  const done = db.records.map((r) => Object.assign({}, r, { _status: "complete" }));
  return active.concat(done).sort((a, b) => (a.startTime < b.startTime ? 1 : -1));
}

function filteredRecords() {
  const q = state.managerSearch.trim().toLowerCase();
  const filter = state.managerFilter;
  return allRecordsCombined().filter((r) => {
    if (filter !== "all" && r._status !== filter) return false;
    if (!q) return true;
    return (
      (r.workerId || "").toLowerCase().includes(q) ||
      (r.workerName || "").toLowerCase().includes(q) ||
      (r.cartridgeId || "").toLowerCase().includes(q)
    );
  });
}

/* ============================================================
   RENDERING
   ============================================================ */
const appEl = () => document.getElementById("app");

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",

}

function render() {
  const el = appEl();
  if (!el) return;
  document.documentElement.setAttribute("data-lang", state.lang);
  let body = "";
  switch (state.screen) {
    case "home": body = renderHome(); break;
    case "dosedock-home": body = renderDoseDockHome(); break;
    case "start-1": body = renderStart1(); break;
    case "start-2": body = renderStart2(); break;
    case "start-3": body = renderStart3(); break;
    case "end-1": body = renderEnd1(); break;
    case "end-2": body = renderEnd2(); break;
    case "end-3": body = renderEnd3(); break;
    case "end-4": body = renderEnd4(); break;
    case "manager": body = renderManager(); break;
    default: body = renderHome();
  }
  el.innerHTML = `${headerHtml()}<main class="app-main">${body}</main>${footerHtml()}`;
  afterRenderHook();
}

function afterRenderHook() {
  if (state.screen === "start-1") {
    const video = document.getElementById("qrVideo");
    const canvas = document.getElementById("qrCanvas");
    const status = document.getElementById("scanStatus");
    if (video && canvas) startQrScanner(video, canvas, status, handleDeviceScanned, nextAutoDeviceCode);
  }
  if (state.screen === "start-2" && !state.flow.cartridgeError) {
    const video = document.getElementById("qrVideo");
    const canvas = document.getElementById("qrCanvas");
    const status = document.getElementById("scanStatus");
    if (video && canvas) startQrScanner(video, canvas, status, handleCartridgeScannedForAssignment, nextAutoCartridgeCode);
  }
  if (state.screen === "end-1" && !state.flow.returnError) {
    const video = document.getElementById("qrVideo");
    const canvas = document.getElementById("qrCanvas");
    const status = document.getElementById("scanStatus");
    if (video && canvas) startQrScanner(video, canvas, status, handleCartridgeScannedForReturn, autoReturnCartridgeCode);
  }
  if (state.screen === "end-2") {
    const video = document.getElementById("stripVideo");
    if (video) {
      startStripCamera(video, cameraUnavailableFallback);
      startQualityLoop();
      startCameraWarmup();
    }
  }
  if (state.screen === "end-3") {
    runAnalysisSequence();
  }
}

/* Camera warm-up: the Capture button stays disabled for
   CAMERA_WARMUP_MS after the step opens, giving the person time
   to position the strip and let focus/exposure settle before
   they take the photo themselves. */
function startCameraWarmup() {
  const btn = document.getElementById("captureBtn");
  const hint = document.getElementById("warmupHint");
  if (btn) btn.disabled = true;
  setTimeout(() => {
    if (state.screen !== "end-2") return;
    if (btn) btn.disabled = false;
    if (hint) hint.style.display = "none";
  }, CAMERA_WARMUP_MS);
}

/* Only reached if the camera never opened at all (permission
   denied / no device) — there is no live feed for the person to
   capture from, so this is the sole case that resolves itself
   after SCAN_TIMEOUT_MS, using a cartridge-derived reading. */
function cameraUnavailableFallback() {
  if (state.screen !== "end-2") return;
  state.flow.demoExposure = hashExposureForCartridge(state.flow.record.cartridgeId);
  goto("end-3");
}

/* ---------- END OF SHIFT — STEP 2 (capture) ---------- */
let qualityLoopId = null;
function startQualityLoop() {
  const video = document.getElementById("stripVideo");
  const canvas = document.getElementById("stripCanvas");
  const indicator = document.getElementById("lightingIndicator");
  if (!video || !canvas) return;
  const tick = () => {
    if (state.screen !== "end-2") return;
    const sample = sampleCenterRegion(video, canvas);
    if (sample && indicator) {
      const q = checkImageQuality(sample);
      indicator.className = "lighting-indicator " + (q.ok ? "ok" : "bad");
      indicator.textContent = t("lightingLabel") + ": " + (q.ok ? t("lightingOk") : sample.brightness < 25 ? t("lightingLow") : t("lightingHigh"));
    }
    qualityLoopId = requestAnimationFrame(tick);
  };
  qualityLoopId = requestAnimationFrame(tick);
}

function captureStrip() {
  const video = document.getElementById("stripVideo");
  const canvas = document.getElementById("stripCanvas");
  const msgEl = document.getElementById("captureMsg");
  const sample = sampleCenterRegion(video, canvas);
  const quality = checkImageQuality(sample);
  if (!quality.ok) {
    if (msgEl) msgEl.innerHTML = `<div class="alert alert-error">${t("imageQualityInsufficient")} ${t("repositionCartridge")}</div>`;
    return;
  }
  if (msgEl) msgEl.innerHTML = `<div class="alert alert-success">✓ ${t("imageReady")}</div>`;
  state.flow.capturedRgb = { r: sample.r, g: sample.g, b: sample.b };
  if (captureFallbackTimer) { clearTimeout(captureFallbackTimer); captureFallbackTimer = null; }
  setTimeout(() => goto("end-3"), 500);
}

      </div>

/* ---------- END OF SHIFT — STEP 3 (AI processing) ---------- */
function runAnalysisSequence() {
  const stages = [
    "imageCaptured", "analysingColourResponse", "extractingVisualFeatures",
    "modelInference", "estimatingExposure", "estimatingConfidence",
  ];
  const list = document.getElementById("analysisStages");
  if (!list) return;
  // Capture the inputs now, at the moment analysis starts, rather than
  // re-reading state.flow inside the delayed callbacks below — if the
  // user navigates away mid-sequence, those callbacks must not act on
  // whatever unrelated flow happens to be in state.flow by the time
  // they fire.
  const runToken = state.flow;
  const imageData = runToken.demoExposure != null
    ? { mode: "demo", exposure: runToken.demoExposure }
    : { mode: "camera", rgb: runToken.capturedRgb };
  let i = 0;
  const step = () => {
    if (state.screen !== "end-3" || state.flow !== runToken) return; // navigated away — abandon
    if (i >= stages.length) {
      const result = runExposureModel(imageData);
      setTimeout(() => {
        if (state.screen !== "end-3" || state.flow !== runToken) return;
        finalizeResult(result);
      }, 400);
      return;
    }
    const el = document.getElementById("stage-" + i);
    if (el) el.classList.add("stage-active");
    i++;
    setTimeout(step, 450);
  };
  setTimeout(step, 300);
}

function renderEnd3() {
  const stages = [
    "imageCaptured", "analysingColourResponse", "extractingVisualFeatures",
    "modelInference", "estimatingExposure", "estimatingConfidence",

}

/* ---------- MANAGER DASHBOARD ---------- */
function summaryCounts() {
  const all = allRecordsCombined();
  const total = all.length;
  const active = all.filter((r) => r._status === "active").length;
  const complete = all.filter((r) => r._status === "complete").length;
  const high = all.filter((r) => r.exposure != null && r.exposure >= 200).length;
  return { total, active, complete, high };
}

        <div class="kv"><span>${t("colStart")}</span><strong>${escapeHtml(r.startTime)}</strong></div>
        <div class="kv"><span>${t("colEnd")}</span><strong>${escapeHtml(r.endTime || "—")}</strong></div>
        <div class="kv"><span>${t("estimatedExposure")}</span><strong>${r.exposure != null ? r.exposure + " ppm" : "—"}</strong></div>
        <div class="kv"><span>${t("modelConfidence")}</span><strong>${r.confidence != null ? r.confidence + "%" : "—"}</strong></div>
        <div class="kv"><span>${t("cartridgeStatusLabel")}</span><strong>${r.cartridgeStatus === "disposed" ? t("disposed") : escapeHtml(r.cartridgeStatus || "—")}</strong></div>
        ${r.exposure != null ? `<div class="modal-swatch" style="background:${(EXPOSURE_SCALE.find(e=>e.ppm===r.exposure)||{}).hex||"#ccc"}"></div>` : ""}
      </div>
    </div>
  `;
}

/* ============================================================
   INITIALIZATION
   ============================================================ */
window.addEventListener("DOMContentLoaded", function () {
  render();
});
</script>
</body>
</html>
